name: Feed La Espumería (marco AO)

on:
  schedule:
    - cron: "20 * * * *"     # cada hora, minuto 20 (UTC)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write             # para el keepalive
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests pillow numpy

      - id: pages
        uses: actions/configure-pages@v5

      - name: Generar imágenes y feed
        env:
          PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python main.py --out-dir site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pausa los workflows programados de repos sin actividad por 60 días.
      # Este paso hace un commit vacío cada ~45 días para que no se pause.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((45*86400)) ]; then
            git config user.name "feed-bot"
            git config user.email "feed-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
